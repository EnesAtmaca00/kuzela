// Isimler ve aciklamalar menu panelinden geliyor, yani HTML'e gomulmeden

const escapeHtml = (value) => String(value == null ? '' : value)
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

function cardsHtml(list, revealed) {
  return list.map((item, index) => {
    const name = escapeHtml(item.name);
    const alt = escapeHtml(item.alt || `${item.name} bij Kuzela The Bowl House`);
    return `
  <article class="product reveal${revealed ? ' visible' : ''}" style="--delay:${index * 70}ms">
    <a href="${ORDER_URL}" target="_top" aria-label="Bestel ${name}">
      <div class="photo">
        <img src="${escapeHtml(item.image)}" alt="${alt}" loading="lazy">
        <span>${String(index + 1).padStart(2, '0')}</span>
      </div>
      <div class="product-copy"><div><h3>${name}</h3><p>${escapeHtml(item.note)}</p></div><strong>${escapeHtml(item.price)}</strong></div>
    </a>
  </article>`;
  }).join('');
}

        .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease var(--delay,0ms),transform .8s cubic-bezier(.22,1,.36,1) var(--delay,0ms)}.reveal.visible{opacity:1;transform:none}

        /* ---- Tablet yatay / kucuk laptop: kartlar 2'li ---- */

      </style>
      <main class="site">
        <section class="hero" id="top"><div class="hero-content"><p class="eyebrow">VERS GEMAAKT · LAAKDAL</p><h1>Jouw bowl.<br>Jouw smaak.</h1><div class="hero-bottom"><p class="hero-copy">Pokébowls, quesadilla’s, wraps, broodjes en wings. Vers bereid, royaal gevuld en klaar wanneer jij dat bent.</p><div class="hero-buttons"><a class="pill lime" href="${ORDER_URL}" target="_top">Bestel online</a><a class="pill" href="#menu">Ontdek het menu</a></div></div></div></section>
        <div class="ticker" aria-hidden="true"><span>VERS GEMAAKT <i>·</i> JIJ KIEST <i>·</i> VOL SMAAK <i>·</i> LAAKDAL <i>·</i></span><span>VERS GEMAAKT <i>·</i> JIJ KIEST <i>·</i> VOL SMAAK <i>·</i> LAAKDAL <i>·</i></span></div>
        <section class="intro wrap" id="over"><div><p class="eyebrow">KUZELA THE BOWL HOUSE</p><h2>Geen standaard fastfood.</h2></div><div class="intro-copy reveal"><p>Goede ingrediënten, stevige porties en combinaties die je zelf samenstelt. Eenvoudig bestellen, vers bereid en precies zoals jij het wilt.</p><a class="pill dark" href="#menu">Waar heb je zin in?</a></div></section>

        <section class="closing"><p class="eyebrow">KLAAR OM TE KIEZEN?</p><h2>Bestel. Proef. Herhaal.</h2><a class="pill dark" href="${ORDER_URL}" target="_top">Bestel bij Kuzela</a></section>
      </main>`;

    /* ---------- reveal animasyonu ---------- */
    const observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    }), { threshold: 0.12 });
    root.querySelectorAll('.reveal').forEach((element) => observer.observe(element));

    /* ---------- iframe yuksekligini Wix'e bildir ---------- */
    const host = this;
    let lastHeight = 0;
    let queueTimer = null;
    // Kartlar menuden mi geldi yoksa yedek listeden mi? Yukseklik mesajiyla
    // birlikte bildiriliyor, boylece disaridan dogrulanabiliyor.
    let productSource = 'fallback';

    // NOT: documentElement/body scrollHeight kullanilmiyor. Onlar iframe'in mevcut
    // yuksekligi kadar buyuk kaliyor ve yukseklik bir daha asla kuculmuyor.
    // Sadece bilesenin gercek yuksekligini olcuyoruz -> hem buyuyup hem kuculebiliyor.
    const measure = () => {
      const height = host.getBoundingClientRect().height;
      return Math.ceil(height || Math.max(document.documentElement.scrollHeight, document.body.scrollHeight));
    };

    const sendHeight = (force) => {
      const height = measure();
      if (!height) return;
      if (!force && Math.abs(height - lastHeight) < 2) return;
      lastHeight = height;
      window.parent.postMessage({ type: 'kuzelaHomeHeight', height, productSource }, '*');
    };

    // requestAnimationFrame kullanmiyoruz: sekme arka plana dusunce callback hic
    // calismayip kilit takili kalabiliyor ve yukseklik guncellemeleri tamamen duruyor.
    const queueSend = () => {
      if (queueTimer) clearTimeout(queueTimer);
      queueTimer = setTimeout(() => { queueTimer = null; sendHeight(false); }, 60);
    };

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(queueSend);
      ro.observe(host);
      ro.observe(document.body);
    }
    root.querySelectorAll('img').forEach((img) => {
      img.addEventListener('load', queueSend);
      img.addEventListener('error', queueSend);
    });
    window.addEventListener('resize', queueSend);
    window.addEventListener('load', () => sendHeight(true));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => sendHeight(true));

    // Wix ilk mesajlari bazen kaciriyor: ilk 6 saniye boyunca tekrar gonder
    [0, 120, 350, 700, 1200, 2000, 3000, 4500, 6000].forEach((ms) => setTimeout(() => sendHeight(true), ms));

    // Emniyet agi: gozlemcilerden biri kacirirsa saniyede bir kontrol et.
    // Yukseklik degismediyse mesaj gonderilmiyor, maliyeti yok denecek kadar az.
    setInterval(() => sendHeight(false), 1000);

    /* ---------- menuden gelen urun verisi ---------- */
    const grid = root.querySelector('.grid');

    const applyProducts = (list) => {
      if (!grid || !Array.isArray(list) || !list.length) return;
      // Kartlar zaten gorunur olarak ciziliyor: veri sonradan geldigi icin
      // reveal animasyonunu bastan oynatmak yerine dogrudan yerine koyuyoruz.
      grid.innerHTML = cardsHtml(list.slice(0, 8), true);
      productSource = 'menu';
      grid.querySelectorAll('img').forEach((img) => {
        img.addEventListener('load', queueSend);
        img.addEventListener('error', queueSend);
      });
      sendHeight(true);
    };

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'kuzelaAskHeight') sendHeight(true);
      if (data.type === 'kuzelaProducts') applyProducts(data.items);
      if (data.type === 'kuzelaTestNavigate') {
        // Gezinme yolunu disaridan tetiklemek icin (tiklamayi taklit eder).
        window.parent.postMessage({ type: 'kuzelaNavigate', url: ORDER_URL }, '*');
      }
    });

    // Sayfa kodu, iframe hazir olmadan urunleri gondermis olabilir.
    // "Hazirim" diyerek verinin bize itilmesini istiyoruz.
    const announceReady = () => window.parent.postMessage({ type: 'kuzelaReady' }, '*');
    [0, 300, 1000, 2500].forEach((ms) => setTimeout(announceReady, ms));

    /* ---------- dis baglantilar ---------- */
    // Kartlar ve butonlar target="_top" ile calisiyordu, ama Wix'in gomulu
    // iframe'i sandbox'li: ust pencereye gitmeye izin verilmiyor ve tiklayinca
    // hicbir sey olmuyordu. Gezinmeyi sayfa koduna devrediyoruz.
    // Sayfa tek basina acildiginda (GitHub Pages) normal gezinme calisiyor.
    root.addEventListener('click', (event) => {
      const path = typeof event.composedPath === 'function' ? event.composedPath() : [];
      const link = path.find((node) => node && node.tagName === 'A' && node.getAttribute('href'));
      if (!link) return;

      const href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#') return; // sayfa ici baglantilar asagida

      event.preventDefault();
      window.parent.postMessage({ type: 'kuzelaNavigate', url: href }, '*');
      try {
        if (window.top === window) window.location.href = href;
        else window.top.location.href = href;
      } catch (error) {
        // Sandbox engelledi: gezinmeyi sayfa kodu yapacak.
      }
    });

    /* ---------- sayfa ici linkler (shadow DOM icinde otomatik calismaz) ---------- */
    root.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        const target = root.getElementById(link.getAttribute('href').slice(1));
        if (!target) return;
        const top = Math.max(0, Math.round(target.getBoundingClientRect().top + window.scrollY));
        // Wix sayfasinin kaymasi icin (Velo kodu varsa calisir)
        window.parent.postMessage({ type: 'kuzelaScrollTo', top }, '*');
        // Velo yoksa iframe kendi icinde kaydirmayi dener
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }
}

if (!customElements.get('kuzela-home')) customElements.define('kuzela-home', KuzelaHome);
</script>
</body>
</html>
